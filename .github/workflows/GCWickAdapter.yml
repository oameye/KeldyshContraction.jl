name: GC Wick Adapter

on:
  push:
    branches:
      - 'research/gc-weighted-wick-adapter'
    paths:
      - '.github/workflows/GCWickAdapter.yml'
      - 'benchmarks/gc_wick_adapter.jl'
      - 'benchmarks/gc_wick_adapter_extended.jl'
      - 'benchmarks/gc_wick_timing.jl'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: |
          julia --project=benchmarks -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(PackageSpec(url="https://github.com/oameye/GraphCombinations.jl", rev="3ca80dcfa1c34e78145d4e90b8733c15eaa5c1ae"))
            Pkg.instantiate()
          '
      - name: Validate GC Wick adapter
        run: |
          julia --project=benchmarks benchmarks/gc_wick_adapter_extended.jl | tee gc-wick-adapter.txt
      - name: Measure matcher-only crossover
        run: |
          julia --project=benchmarks benchmarks/gc_wick_timing.jl | tee gc-wick-timing.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gc-wick-adapter
          path: |
            gc-wick-adapter.txt
            gc-wick-timing.txt
