name: GC propagator canonicalization research

on:
  workflow_dispatch:
  push:
    branches:
      - research-gc-propagator-canonicalization
    paths:
      - research/graphcombinations_propagator_canonicalization_oracle.jl
      - research/graphcombinations_propagator_gc_adapter.jl
      - research/graphcombinations_propagator_native_adapter.jl
      - research/graphcombinations_propagator_canonicalization_benchmark.jl
      - research/graphcombinations_propagator_wick_oracle.jl
      - research/graphcombinations_propagator_native_wick_oracle.jl
      - .github/workflows/GCPropagatorCanonicalizationResearch.yml

permissions:
  contents: read

jobs:
  oracle:
    name: GC/Nauty physical oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10.12'
      - uses: julia-actions/cache@v3
      - name: Pin exact GraphCombinations native-relation kernel
        run: |
          julia --project=. --color=yes -e '
            using Pkg
            Pkg.add(url="https://github.com/oameye/GraphCombinations.jl", rev="f5fa566d9d0219d7fbc49dfce234403eefa9397f")
          '
      - name: Run physical canonicalization oracle
        run: julia --project=. --color=yes research/graphcombinations_propagator_canonicalization_oracle.jl
      - name: Benchmark reusable physical canonicalization
        run: julia --project=. --color=yes research/graphcombinations_propagator_canonicalization_benchmark.jl
      - name: Certify existing subdivision path on real Wick workloads
        run: julia --project=. --color=yes research/graphcombinations_propagator_wick_oracle.jl
      - name: Certify native relations on real Wick workloads
        run: julia --project=. --color=yes research/graphcombinations_propagator_native_wick_oracle.jl
