name: Legacy topology routing probe

on:
  pull_request:
    branches:
      - main
      - fix-projective-loop-sign-character
    paths:
      - '.github/workflows/LegacyTopologyRoutingProbe.yml'
      - 'research/legacy_topology_routing_probe.jl'
      - 'src/propagator_algebra/diagram.jl'
      - 'src/propagator_algebra/legacy_momentum_routing.jl'
      - 'src/self_energy.jl'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate package
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Compare topology-parity and structural routing
        run: julia --project=. research/legacy_topology_routing_probe.jl
