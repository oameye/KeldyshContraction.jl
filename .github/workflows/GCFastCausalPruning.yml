name: GC Fast Causal Pruning

on:
  push:
    branches:
      - 'research/gc-weighted-wick-adapter'
    paths:
      - '.github/workflows/GCFastCausalPruning.yml'
      - 'benchmarks/gc_wick_adapter.jl'
      - 'benchmarks/gc_wick_fast_causal_pruning.jl'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'lts'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: |
          julia --project=benchmarks -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(PackageSpec(url="https://github.com/oameye/GraphCombinations.jl", rev="62858aa4324f1edce1d63db73cfca43b013c08fd"))
            Pkg.instantiate()
          '
      - name: Validate incremental causal pruning
        run: |
          julia --project=benchmarks benchmarks/gc_wick_fast_causal_pruning.jl | tee gc-wick-fast-causal-pruning.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gc-wick-fast-causal-pruning
          path: gc-wick-fast-causal-pruning.txt
