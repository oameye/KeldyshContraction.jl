name: GraphCombinations packed loop corpus certification

on:
  pull_request:
    branches:
      - research-gc-nauty-loop-corpus
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/GraphCombinationsLoopCorpus.yml'
      - 'Project.toml'
      - 'src/**'
      - 'research/graphcombinations_loop_corpus_certification.jl'
  workflow_dispatch:

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        loop_count: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Route KC loop adapter through packed candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/collision_momentum_graphcombinations.jl")
          text = path.read_text()
          replacements = (
              (
                  "workspace::GC.DirectedCanonicalizationWorkspace\n        buffer::GC.DirectedCanonicalizationBuffer\n        graph::GC.DirectedGCGraphBuffer",
                  "workspace::GC.PackedDirectedCanonicalizationWorkspace\n        buffer::GC.DirectedCanonicalizationBuffer\n        graph::GC.DirectedGCGraphBuffer",
              ),
              (
                  "GC.DirectedCanonicalizationWorkspace(capacity),",
                  "GC.PackedDirectedCanonicalizationWorkspace(capacity),",
              ),
              (
                  "GC.canonicalize_directed!(\n            storage.buffer, storage.workspace, storage.graph, storage.labels\n        )",
                  "GC.canonicalize_directed_packed!(\n            storage.buffer, storage.workspace, storage.graph, storage.labels\n        )",
              ),
          )
          for old, new in replacements:
              if text.count(old) < 1:
                  raise SystemExit(f"packed adapter patch target not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Instantiate baseline environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Pin exact GraphCombinations packed candidate
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/oameye/GraphCombinations.jl", rev="f8ff5edf0f7b1cec29a4046d19b1d48e597c2859")'
      - name: Add benchmark harness
        run: julia --project=. -e 'using Pkg; Pkg.add("BenchmarkTools")'
      - name: Select loop-count slice
        run: sed -i 's/const CORPUS_LOOP_COUNTS = 1:5/const CORPUS_LOOP_COUNTS = ${{ matrix.loop_count }}:${{ matrix.loop_count }}/' research/graphcombinations_loop_corpus_certification.jl
      - name: Run packed GC versus Nauty corpus
        shell: bash
        run: |
          set -o pipefail
          julia --project=. research/graphcombinations_loop_corpus_certification.jl 2>&1 | tee graphcombinations-packed-loop-corpus-${{ matrix.loop_count }}.log
      - name: Preserve corpus diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphcombinations-packed-loop-corpus-${{ matrix.loop_count }}
          path: graphcombinations-packed-loop-corpus-${{ matrix.loop_count }}.log

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Apply JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2"); using JuliaFormatter; format(".")'
      - name: Check formatting
        run: git diff --exit-code
      - name: Capture formatter diff
        if: always()
        run: git diff > juliaformatter.diff
      - name: Preserve formatter diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphcombinations-packed-loop-corpus-formatter
          path: juliaformatter.diff
