name: Apply production GC source formatting

on:
  push:
    branches:
      - production-gc-oneword-matrixfree-loop-quotient
    paths:
      - .github/workflows/ApplyProductionGCFormat.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-gc-oneword-matrixfree-loop-quotient
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Format promoted production source
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate(; temp=true)
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format("src/collision_momentum_graphcombinations.jl")
          '
      - name: Commit formatter checkpoint
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/collision_momentum_graphcombinations.jl
          git commit -m "style: format production GC loop quotient"
          git push origin HEAD:production-gc-oneword-matrixfree-loop-quotient
