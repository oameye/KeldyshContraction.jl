name: GraphCombinations loop orbit equivalence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/GraphCombinationsLoopEquivalence.yml'
      - 'research/graphcombinations_loop_equivalence_probe.jl'
      - 'src/collision_momentum_quotient.jl'
      - 'benchmarks/collision_reduction.jl'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(PackageSpec(url="https://github.com/oameye/GraphCombinations.jl", rev="a09d6fdbd86bb4accae6ffbd3be1e0c801c49c05")); Pkg.add("BenchmarkTools")'
      - name: Check loop-orbit equivalence and warmed medians
        shell: bash
        run: |
          set -o pipefail
          julia --project=. research/graphcombinations_loop_equivalence_probe.jl 2>&1 | tee loop-equivalence.log
      - name: Preserve loop-equivalence diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-equivalence-diagnostics
          path: loop-equivalence.log
