name: Apply KC-sized GC frontier

on:
  push:
    branches:
      - production-gc-oneword-matrixfree-loop-quotient
    paths:
      - .github/workflows/ApplyKCFrontierSizing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-gc-oneword-matrixfree-loop-quotient
      - name: Right-size production GC frontier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/collision_momentum_graphcombinations.jl")
          text = path.read_text()

          replacements = (
              (
                  "# Research GraphCombinations backend for the physical dummy-loop quotient.",
                  "# GraphCombinations backend for the physical dummy-loop quotient.",
              ),
              (
                  "capacity; frontier_capacity=max(4096, 64 * capacity)",
                  "capacity; frontier_capacity=32",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"frontier-sizing target changed: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit KC frontier sizing
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/collision_momentum_graphcombinations.jl
          git commit -m "perf: right-size GC frontier for KC loop graphs"
          git push origin HEAD:production-gc-oneword-matrixfree-loop-quotient
