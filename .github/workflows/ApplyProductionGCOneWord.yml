name: Clean production GC one-word integration

on:
  workflow_dispatch:
  push:
    branches:
      - production-gc-oneword-matrixfree-loop-quotient
    paths:
      - .github/workflows/ApplyProductionGCOneWord.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-gc-oneword-matrixfree-loop-quotient
      - name: Use only the public reusable-input API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/collision_momentum_graphcombinations.jl")
          text = path.read_text()
          old = '''GC.canonicalize_directed_simple!(
                      storage.buffer,
                      storage.workspace,
                      GC._directed_graph_view(storage.graph),
                      @view(storage.labels[1:num_vertices]),
                  )'''
          new = '''GC.canonicalize_directed_simple!(
                      storage.buffer, storage.workspace, storage.graph, storage.labels
                  )'''
          if text.count(old) != 1:
              raise SystemExit("public GC boundary patch target changed")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git rm .github/workflows/ApplyProductionGCOneWord.yml

      - name: Commit clean source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/collision_momentum_graphcombinations.jl
          git commit -m "refactor: consume public GC prepared canonicalizer"
          git push origin HEAD:production-gc-oneword-matrixfree-loop-quotient
