name: GC physical canonicalization production acceptance

on:
  push:
    branches:
      - production-gc-physical-canonicalization
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  tests:
    name: Tests - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version:
          - lts
          - '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  jet:
    name: JET - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1.13'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          show-versioninfo: true
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run JET analysis
        run: julia --project=test test/quality/JET.jl

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Set up test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Run quality gates
        run: julia --project=test test/quality/quality_test.jl
      - name: Run documentation doctests
        run: julia --project=test test/quality/documentation.jl

  wick-acceptance:
    name: Real Wick acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run production physical canonicalization oracle and benchmark
        run: julia --project=. --color=yes research/production_gc_physical_wick_acceptance.jl
