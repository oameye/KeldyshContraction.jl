name: GraphCombinations rooted topology probe

on:
  pull_request:
    branches:
      - main
      - fix-projective-loop-sign-character
    paths:
      - '.github/workflows/GraphCombinationsTopologyProbe.yml'
      - 'research/graphcombinations_rooted_topology_probe.jl'
      - 'src/**'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(PackageSpec(url="https://github.com/oameye/GraphCombinations.jl", rev="e0e5d7dc4e14f4fc356ffeee3809fdb5b47fcf12"))'
      - name: Compare rooted GraphCombinations topology classes with Nauty
        run: julia --project=. research/graphcombinations_rooted_topology_probe.jl
