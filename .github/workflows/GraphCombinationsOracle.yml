name: GraphCombinations oracle

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/GraphCombinationsOracle.yml'
      - 'research/graphcombinations_nauty_adapter.jl'
      - 'src/**'
      - 'benchmarks/**'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(PackageSpec(url="https://github.com/oameye/GraphCombinations.jl", rev="76b7dc50311f2715dfce3e29461c528c454406c3")); Pkg.add("BenchmarkTools")'
      - name: Compare GraphCombinations with Nauty
        run: julia --project=. research/graphcombinations_nauty_adapter.jl
