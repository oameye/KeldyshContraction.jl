name: Temporary format GC400

on:
  push:
    branches:
      - production-gc-oneword-matrixfree-loop-quotient
    paths:
      - .github/workflows/_tmp_format_gc400.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: production-gc-oneword-matrixfree-loop-quotient
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - name: Format GC400 touched Julia files
        run: |
          julia -e 'using Pkg; Pkg.add("JuliaFormatter")'
          julia -e 'using JuliaFormatter; foreach(format_file, ["src/KeldyshContraction.jl", "src/collision_momentum_graphcombinations.jl", "src/collision_momentum_workspace.jl", "research/graphcombinations_production_workspace_acceptance.jl"])'
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/KeldyshContraction.jl src/collision_momentum_graphcombinations.jl src/collision_momentum_workspace.jl research/graphcombinations_production_workspace_acceptance.jl
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "style: format production GC loop quotient"
          git push origin HEAD:production-gc-oneword-matrixfree-loop-quotient
