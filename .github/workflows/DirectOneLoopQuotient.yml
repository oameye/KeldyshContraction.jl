name: Direct one-loop quotient research

on:
  pull_request:
    branches:
      - research-gc-nauty-loop-corpus
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/DirectOneLoopQuotient.yml'
      - 'research/direct_one_loop_quotient_probe.jl'
      - 'src/**'
      - 'Project.toml'
  workflow_dispatch:

jobs:
  direct-one-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate baseline environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Pin exact GraphCombinations research candidate
        run: julia --project=. -e 'using Pkg; Pkg.add(url="https://github.com/oameye/GraphCombinations.jl", rev="2885d19acda65b686314aef95f29035e1448de2f")'
      - name: Add benchmark harness
        run: julia --project=. -e 'using Pkg; Pkg.add("BenchmarkTools")'
      - name: Compare direct one-loop quotient with Nauty and GC oracles
        shell: bash
        run: |
          set -o pipefail
          julia --project=. research/direct_one_loop_quotient_probe.jl 2>&1 | tee direct-one-loop-quotient.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: direct-one-loop-quotient
          path: direct-one-loop-quotient.log

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Apply JuliaFormatter
        run: julia -e 'using Pkg; Pkg.add(name="JuliaFormatter", version="2"); using JuliaFormatter; format("research/direct_one_loop_quotient_probe.jl")'
      - name: Check formatting
        run: git diff --exit-code
