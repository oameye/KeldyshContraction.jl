name: GraphCombinations loop canonicalization probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/GraphCombinationsLoopProbe.yml'
      - 'research/graphcombinations_loop_probe.jl'
      - 'src/collision_momentum_quotient.jl'
      - 'benchmarks/collision_reduction.jl'
      - 'Project.toml'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate research environment
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.add(PackageSpec(url="https://github.com/oameye/GraphCombinations.jl", rev="ec5f84d4b1b1f21b2dacdb00ce4ed9af6bd68fa8")); Pkg.add("BenchmarkTools")'
      - name: Inventory 2-loop and 4-loop semantic graphs
        run: |
          julia --project=. research/graphcombinations_loop_probe.jl 2 inventory
          julia --project=. research/graphcombinations_loop_probe.jl 4 inventory
      - name: Measure 2-loop canonicalization with 30 second bound
        run: |
          set +e
          timeout 30s julia --project=. research/graphcombinations_loop_probe.jl 2 measure
          status=$?
          if [ "$status" -eq 124 ]; then
            echo 'GC 2-loop measurement timed out after 30 seconds'
            exit 0
          fi
          exit "$status"
      - name: Measure 4-loop canonicalization with 30 second bound
        run: |
          set +e
          timeout 30s julia --project=. research/graphcombinations_loop_probe.jl 4 measure
          status=$?
          if [ "$status" -eq 124 ]; then
            echo 'GC 4-loop measurement timed out after 30 seconds'
            exit 0
          fi
          exit "$status"
