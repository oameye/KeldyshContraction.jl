name: finalize-gc-propagator-native-research

on:
  push:
    branches:
      - research-gc-propagator-canonicalization
    paths:
      - .github/workflows/FinalizeGCPropagatorNativeResearch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research-gc-propagator-canonicalization
      - uses: julia-actions/setup-julia@latest
        with:
          version: '1'
      - name: Strengthen native corpus benchmark and fix call-count contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/graphcombinations_propagator_native_wick_oracle.jl')
          s = p.read_text()
          old = '''function native_best_corpus_time(f; samples=5)\n    best = Inf\n    for _ in 1:samples\n        elapsed = @elapsed f()\n        best = min(best, elapsed)\n    end\n    return best\nend\n'''
          new = '''function native_best_corpus_time(f, repetitions; samples=7)\n    best = Inf\n    for _ in 1:samples\n        elapsed = @elapsed for _ in 1:repetitions\n            f()\n        end\n        best = min(best, elapsed)\n    end\n    return best / repetitions\nend\n\nfunction native_hybrid_path_counts(corpus, scratch::GCNativePhysicalCanonicalizationWorkspace)\n    direct = 0\n    for contractions in corpus\n        graph_positions = KC.canonicalization_positions(contractions)\n        direct_graph, vertex_colors, simple =\n            gc_direct_graph!(scratch.direct, contractions, graph_positions)\n        GC.canonicalize_directed!(\n            scratch.direct.result, scratch.direct.search, direct_graph, vertex_colors\n        )\n        use_direct = isone(GC.canonical_automorphism_order(scratch.direct.result)) ||\n                     (simple && KC.uniform_coloring(contractions))\n        direct += Int(use_direct)\n    end\n    return direct, length(corpus) - direct\nend\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''function benchmark_native_corpus(label, corpus, gadget_scratch, native_scratch)\n    isempty(corpus) && return nothing\n'''
          new = '''function benchmark_native_corpus(label, corpus, gadget_scratch, native_scratch)\n    isempty(corpus) && return nothing\n    direct_paths, relation_paths = native_hybrid_path_counts(corpus, native_scratch)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    gadget_time = native_best_corpus_time(gadget_batch)\n    native_time = native_best_corpus_time(native_batch)\n    hybrid_time = native_best_corpus_time(hybrid_batch)\n    nauty_time = native_best_corpus_time(nauty_batch)\n'''
          new = '''    timing_repetitions = max(1, cld(50_000, length(corpus)))\n    gadget_time = native_best_corpus_time(gadget_batch, timing_repetitions)\n    native_time = native_best_corpus_time(native_batch, timing_repetitions)\n    hybrid_time = native_best_corpus_time(hybrid_batch, timing_repetitions)\n    nauty_time = native_best_corpus_time(nauty_batch, timing_repetitions)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        "\\tcalls=", length(corpus),\n        "\\tgadget_over_nauty=", round(gadget_time / nauty_time; digits=3),\n'''
          new = '''        "\\tcalls=", length(corpus),\n        "\\tdirect_paths=", direct_paths,\n        "\\trelation_paths=", relation_paths,\n        "\\ttiming_repetitions=", timing_repetitions,\n        "\\ttimed_calls=", timing_repetitions * length(corpus),\n        "\\tgadget_over_nauty=", round(gadget_time / nauty_time; digits=3),\n'''
          assert old in s
          s = s.replace(old, new, 1)
          assert '@test totals.calls == 28_868' in s
          s = s.replace('@test totals.calls == 28_868', '@test totals.calls == 14_347', 1)
          p.write_text(s)
          PY
      - name: Apply JuliaFormatter
        run: |
          julia -e 'using Pkg; Pkg.add(PackageSpec(name="JuliaFormatter"))'
          julia -e 'using JuliaFormatter; format(".", verbose=true)'
      - name: Commit final research formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research .github/workflows/GCPropagatorCanonicalizationResearch.yml
          if ! git diff --cached --quiet; then
            git commit -m 'research: harden native propagator benchmark'
            git push origin HEAD:research-gc-propagator-canonicalization
          fi
